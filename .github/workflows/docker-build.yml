name: Docker Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate Python application syntax
        run: |
          python -m py_compile app/app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (No push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: sigchain-demo:latest

      - name: Create security artifacts directory
        run: mkdir -p security-artifacts

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0.17.9
        with:
          image: sigchain-demo:latest
          format: spdx-json
          output-file: security-artifacts/sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: security-artifacts/sbom.spdx.json
          if-no-files-found: error

      - name: Run Trivy vulnerability scanner (JSON format)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'sigchain-demo:latest'
          format: 'json'
          output: 'security-artifacts/trivy-report.json'
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'

      - name: Run Trivy vulnerability scanner (Table format)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'sigchain-demo:latest'
          format: 'table'
          output: 'security-artifacts/trivy-report.txt'
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'

      - name: Display Trivy Vulnerability Summary in Log
        run: |
          echo "========================================================"
          echo "           TRIVY VULNERABILITY SUMMARY REPORT           "
          echo "========================================================"
          cat security-artifacts/trivy-report.txt

      - name: Upload Vulnerability Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-reports
          path: |
            security-artifacts/trivy-report.json
            security-artifacts/trivy-report.txt
          if-no-files-found: error

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Execute Cosign Digital Signing & Verification (Phase 4)
        run: |
          chmod +x security/sign-and-verify.sh
          ./security/sign-and-verify.sh

      - name: Upload Digital Signature Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digital-signatures
          path: |
            security-artifacts/image-digest.txt
            security-artifacts/image.bundle
            cosign.pub
          if-no-files-found: error

      - name: Execute Security Policy Enforcement (Phase 5)
        run: |
          chmod +x security/verify-policy.sh
          ./security/verify-policy.sh


